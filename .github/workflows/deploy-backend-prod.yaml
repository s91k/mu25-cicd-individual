name: Deploy backend to production

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Copy dev to prod
        run: skopeo copy ${{ secrets.DOCKERHUB_USERNAME }}/bookstore-backend:dev ${{ secrets.DOCKERHUB_USERNAME }}/bookstore-backend:prod

      - name: Trigger deployment to Render
        run: curl -X POST ${{ secrets.RENDER_BACKEND_PROD_DEPLOY_HOOK }}