spring:
  application:
    name: bookstore_api

  h2:
    console:
      enabled: true

  datasource:
    url: jdbc:h2:mem:database
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}
    driverClassName: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true